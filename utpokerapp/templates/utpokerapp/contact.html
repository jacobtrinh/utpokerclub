{% extends 'utpokerapp/main.html/' %}

{% block content %}

<div class="contact-hero">
    <h1>Contact Us</h1>
    <p>Get in touch with the UT Poker Club!</p>
</div>

<div class="container">
    <form class="contact-form" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstname" placeholder="Your first name">
        </div>

        <div class="form-group">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname" placeholder="Your last name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email address">
        </div>

        <div class="form-group">
            <label for="subject">Message</label>
            <textarea id="subject" name="subject" placeholder="How can we help you?"></textarea>
        </div>

        <button type="submit" class="submit-button">Send Message</button>
    </form>
</div>

<style>

    :root {
        --ut-burnt-orange: #BF5700;
        --ut-charcoal: #333F48;
        --ut-white: #FFFFFF;
        --ut-gray: #F8F8F8;
    }

    .contact-hero {
        background-color: var(--ut-burnt-orange);
        color: var(--ut-white);
        padding: 4rem 2rem;
        text-align: center;
        margin-bottom: 3rem;
    }

    .contact-hero h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        font-weight: bold;
    }

    .contact-hero p {
        font-size: 1.2rem;
        opacity: 0.9;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 2rem 4rem 2rem;
    }

    .contact-form {
        background: var(--ut-white);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--ut-charcoal);
        font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    textarea {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid #E0E0E0;
        border-radius: 4px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
        outline: none;
        border-color: var(--ut-burnt-orange);
    }

    textarea {
        min-height: 150px;
        resize: vertical;
    }

    .submit-button {
        background-color: var(--ut-burnt-orange);
        color: var(--ut-white);
        padding: 1rem 2rem;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.3s ease;
        width: 100%;
    }

    .submit-button:hover {
        background-color: #A64B00;
    }


    @media (max-width: 768px) {
        .contact-hero {
            padding: 3rem 1rem;
        }

        .contact-hero h1 {
            font-size: 2rem;
        }

        .container {
            padding: 0 1rem 3rem 1rem;
        }

        .contact-form {
            padding: 1.5rem;
        }
    }
</style>

{% endblock %}
